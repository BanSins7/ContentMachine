<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0e12">
  <title>Instagram Downloader — ContentMachine</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Навигация">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div><span>Content<span class="brand-light">Machine</span></span></div>
      <nav aria-label="Инструменты"><div class="nav-item selected" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg><span>Instagram Downloader</span><span class="nav-active"></span></div></nav>
    </aside>
    <main class="main">
      <div class="content">
        <div class="title-row"><div class="title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg></div><h1>Instagram Downloader</h1></div>
        <section class="metrics" aria-label="Статистика">
          <div class="metric"><span class="metric-label">Видео скачано</span><strong id="videoCount">—</strong></div>
          <div class="metric"><span class="metric-label">Расходы на распознавание</span><strong id="spentAmount">—</strong></div>
        </section>
        <section class="downloader" aria-label="Скачать из Instagram">
          <form id="findForm" novalidate>
            <label for="targetInput">Ссылка на аккаунт или видео</label>
            <div class="input-row"><div class="url-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13.6a5.2 5.2 0 0 0 7.4 0l2-2a5.2 5.2 0 0 0-7.3-7.4l-1.2 1.2"/><path d="M14 10.4a5.2 5.2 0 0 0-7.4 0l-2 2a5.2 5.2 0 0 0 7.3 7.4l1.2-1.2"/></svg><input id="targetInput" type="text" spellcheck="false" autocomplete="off" placeholder="instagram.com/reel/... или instagram.com/username/" required></div><button class="button primary" id="findButton" type="submit">Найти <span aria-hidden="true">→</span></button></div>
          </form>
          <div id="errorBox" class="error-box" role="alert" hidden></div>
          <div id="resultBox" class="result-box" hidden><div class="result-meta"><span class="result-label">Найдено видео</span><strong id="foundCount">0</strong></div><button id="downloadButton" class="button primary" type="button">Скачать <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 19v2h16v-2"/></svg></button></div>
          <div id="progressBox" class="progress-box" hidden><div class="progress-head"><span id="progressTitle">Обработка…</span><span id="progressValue" class="progress-value"></span></div><div id="progressTrack" class="progress-track" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="100"><div id="progressFill" class="progress-fill"></div></div><div id="progressDetail" class="progress-detail"></div></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
