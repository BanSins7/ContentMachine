services:
  postgres:
    image: postgres:17-alpine
    container_name: contentmachine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentmachine
      POSTGRES_DB: contentmachine
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run SETUP_POSTGRES_WINDOWS.bat first}"
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentmachine -d contentmachine"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  cm_postgres_data:
