name: RTB Market Intelligence contract tests
on:
  pull_request:
    paths:
      - "intelligence/market_intelligence/**"
      - "intelligence/taxonomy_builder/market_intelligence_v3.py"
      - "tests/test_market_intelligence_contracts.py"
      - "tests/test_market_intelligence_http.py"
      - "tests/test_market_profile_discovery.py"
      - "tests/test_market_independent_analytics.py"
      - "tests/test_market_brightdata_provider.py"
      - "tests/test_market_replica_smoke.py"
      - "intelligence/market_intelligence/replica_probe.py"
      - "intelligence/config.py"
      - "intelligence/migrations/080_mi_self_contained_analytics.sql"
      - ".github/workflows/rtb-market-intelligence.yml"
  push:
    branches:
      - "feature/rtb-market-intelligence-*"
    paths:
      - "intelligence/market_intelligence/**"
      - "intelligence/taxonomy_builder/market_intelligence_v3.py"
      - "tests/test_market_intelligence_contracts.py"
      - "tests/test_market_intelligence_http.py"
      - "tests/test_market_profile_discovery.py"
      - "tests/test_market_independent_analytics.py"
      - "tests/test_market_brightdata_provider.py"
      - "tests/test_market_replica_smoke.py"
      - "intelligence/market_intelligence/replica_probe.py"
      - "intelligence/config.py"
      - "intelligence/migrations/080_mi_self_contained_analytics.sql"
      - ".github/workflows/rtb-market-intelligence.yml"
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Compile Python integration
        run: python -m compileall -q app.py intelligence/market_intelligence intelligence/taxonomy_builder/market_intelligence_v3.py
      - name: Check JavaScript syntax
        run: node --check site/market-intelligence.js
      - name: Compile all copied A/B/C packages
        run: python -m compileall -q intelligence/market_intelligence/_copied
      - name: Market contract tests
        run: |
          python -m unittest discover -s tests -p "test_market_intelligence_*.py" -v
          python -m unittest discover -s tests -p "test_market_profile_discovery.py" -v
          python -m unittest discover -s tests -p "test_market_independent_analytics.py" -v
          python -m unittest discover -s tests -p "test_market_brightdata_provider.py" -v
          python -m unittest discover -s tests -p "test_market_replica_smoke.py" -v
          python -m intelligence.market_intelligence.replica_probe

  postgres17-mi-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cm_mi
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cm_mi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm_mi -d cm_mi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_DB_ENABLED: '1'
      CM_DB_DSN: postgresql://cm_mi:ci-only@localhost:5432/cm_mi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install -r intelligence/requirements.txt
      - name: Fresh migration install, including standalone MI
        run: python -m intelligence.migrate
      - name: Migration replay is a no-op
        run: python -m intelligence.migrate
      - name: Verify independent media schema and exact project asset FK
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["CM_DB_DSN"]) as con:
              version=int(con.execute("show server_version_num").fetchone()[0])
              assert 170000<=version<180000
              assert con.execute("select to_regclass('mi_video_analyses')").fetchone()[0]
              row=con.execute("""select count(*) from pg_constraint
                where conrelid='mi_video_analyses'::regclass
                and contype='f'""").fetchone()
              assert row[0]>=3, row
          PY
