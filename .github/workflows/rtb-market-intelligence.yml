          python -m intelligence.market_intelligence.replica_probe

  postgres17-mi-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cm_mi
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cm_mi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm_mi -d cm_mi_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_DB_ENABLED: '1'
      CM_DB_DSN: postgresql://cm_mi:ci-only@localhost:5432/cm_mi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install -r intelligence/requirements.txt
      - name: Fresh migration install, including standalone MI
        run: python -m intelligence.migrate
      - name: Migration replay is a no-op
        run: python -m intelligence.migrate
      - name: PostgreSQL 17 live query smoke for expired acquisition lease cleanup
        run: |
          python - <<'PY'
          from intelligence.market_intelligence.batch import expire_exhausted_downloads
          assert expire_exhausted_downloads()==0
          PY
      - name: PostgreSQL 17 actual media-root recovery SQL regression
        run: |
          python - <<'PY'
          import os
          import psycopg
          from scripts.prepare_market_tiktok_top100 import RECOVER_MEDIA_ROOT_SQL
          with psycopg.connect(os.environ["CM_DB_DSN"]) as conn:
              jid=conn.execute("""
                INSERT INTO jobs
                (job_type,idempotency_key,payload,state,attempts,
                 max_attempts,last_error,result)
                VALUES ('market.media_analyze.v1',
                        'ci-only-real-jsonb-recovery-sql',
                        '{}'::jsonb,'failed',1,1,
                        'media_roots_unconfigured',
                        '{"marketing_local_recovery":"media_root_v1"}'::jsonb)
                RETURNING id
              """).fetchone()[0]
              changed=conn.execute(
                  RECOVER_MEDIA_ROOT_SQL,("media_root_v2",jid)).fetchone()
              assert changed==(jid,),changed
              row=conn.execute(
                  "SELECT state,attempts,last_error,result FROM jobs WHERE id=%s",
                  (jid,)).fetchone()
              assert row[0]=="queued" and row[1]==0 and row[2] is None,row
              assert row[3]["marketing_local_recovery"]=="media_root_v2",row
              assert conn.execute(
                  RECOVER_MEDIA_ROOT_SQL,("media_root_v2",jid)).fetchone() is None
              conn.rollback()  # No persistent CI repair jobs.
          PY
      - name: PostgreSQL 17 verified old-worker media-root recovery SQL
        run: |
          python - <<'PY'
          import os
          import psycopg
          from scripts.prepare_market_tiktok_top100 import RECOVER_VERIFIED_MEDIA_ROOT_SQL
          with psycopg.connect(os.environ["CM_DB_DSN"]) as conn:
              for old,new in (
                  ("media_root_v1","media_root_verified_v2"),
                  ("media_root_v2","media_root_verified_v3")
              ):
                  jid=conn.execute("""
                    INSERT INTO jobs(job_type,idempotency_key,payload,state,
                                     attempts,max_attempts,last_error,result)
                    VALUES ('market.media_analyze.v1',
                            %s,'{}'::jsonb,'failed',1,1,
                            'media_roots_unconfigured',
                            jsonb_build_object('marketing_local_recovery',%s::text))
                    RETURNING id
                  """,("ci-verified-root-"+old,old)).fetchone()[0]
                  changed=conn.execute(
                      RECOVER_VERIFIED_MEDIA_ROOT_SQL,(new,jid,old)).fetchone()
                  assert changed==(jid,),changed
                  got=conn.execute(
                      "SELECT state,attempts,result FROM jobs WHERE id=%s",
                      (jid,)).fetchone()
                  assert got[0]=="queued" and got[1]==0,got
                  assert got[2]["marketing_local_recovery"]==new,got
                  assert conn.execute(
                      RECOVER_VERIFIED_MEDIA_ROOT_SQL,(new,jid,old)).fetchone() is None
              conn.rollback()
          PY
      - name: PostgreSQL 17 exact timeout and expired analysis repair statements
        run: |
          python - <<'PY'
          import os
          import psycopg
          from scripts.prepare_market_tiktok_top100 import (
              RECOVER_TIKTOK_TIMEOUT_SQL,RECOVER_EXPIRED_ANALYSIS_SQL)
          with psycopg.connect(os.environ["CM_DB_DSN"]) as con:
              # Compile and execute the bound timeout update on a non-existent
              # source job. Never create a fake project source/remote request.
              no_job=con.execute(RECOVER_TIKTOK_TIMEOUT_SQL,(
                  "00000000-0000-0000-0000-000000000001",
                  "a"*32)).fetchone()
              assert no_job is None
              jid=con.execute("""
                INSERT INTO jobs(job_type,idempotency_key,payload,state,attempts,
                                 max_attempts,lease_until,result)
                VALUES('market.media_analyze.v1',
                       'ci-orphan-expired-media-job',
                       %s::jsonb,'running',1,1,
                       clock_timestamp()-interval '10 minutes',
                       '{"marketing_local_recovery":"media_root_v1"}'::jsonb)
                RETURNING id
              """,('{"project_id":"'+"a"*32+'","video_id":8}',)).fetchone()[0]
              repaired=con.execute(RECOVER_EXPIRED_ANALYSIS_SQL,
                                   (jid,'market.media_analyze.v1',
                                    "a"*32,"8")).fetchone()
              assert repaired==(jid,),repaired
              state=con.execute(
                  "SELECT state,attempts,lease_generation,result FROM jobs WHERE id=%s",
                  (jid,)).fetchone()
              assert state[0]=='queued' and state[1]==0 and state[2]==1,state
              assert state[3]['marketing_local_recovery']=='media_lease_recovered_v1'
              assert con.execute(RECOVER_EXPIRED_ANALYSIS_SQL,
                                (jid,'market.media_analyze.v1',
                                 "a"*32,"8")).fetchone() is None
              con.rollback()
          PY
      - name: PostgreSQL 17 bind check for exact post99 import retry SQL
        run: |
          python - <<'PY'
          import os
          import psycopg
          from scripts.prepare_market_tiktok_top100 import RECOVER_LOCAL_WORKER_IMPORT_SQL
          with psycopg.connect(os.environ["CM_DB_DSN"]) as conn:
              row=conn.execute(
                RECOVER_LOCAL_WORKER_IMPORT_SQL,
                ("00000000-0000-0000-0000-000000000001",
                 "a"*32,
                 "ModuleNotFoundError: No module named 'local_worker'"),
              ).fetchone()
              assert row is None
              conn.rollback()
          PY
      - name: PostgreSQL 17 real Marketing Group C freeze SQL placeholder regression
        run: |
          python - <<'PY'
          import os
          import psycopg
          from intelligence.market_intelligence.service import (
              SQL_VIDEO_EVIDENCE, SQL_METRIC_HISTORY
          )
          # EXPLAIN invokes psycopg's *real* SQL parameter parser and
          # PostgreSQL's planner without changing data or incurring costs.
          # Raw LIKE '%/photo/%' failed before it reached PostgreSQL.
          project = "00000000-0000-0000-0000-000000000000"
          with psycopg.connect(os.environ["CM_DB_DSN"]) as conn:
              with conn.transaction():
                  conn.execute("SET TRANSACTION READ ONLY")
                  video_bindings = (project,)*6 + (None, None)
                  plan = conn.execute("EXPLAIN " + SQL_VIDEO_EVIDENCE,
                                      video_bindings).fetchall()
                  assert plan, "Expected query plan for video/photo evidence"
                  metrics = conn.execute("EXPLAIN " + SQL_METRIC_HISTORY,
                                         ([], False)).fetchall()
                  assert metrics, "Expected query plan for Group C metric history"
                  records = conn.execute(SQL_VIDEO_EVIDENCE,
                                         video_bindings).fetchall()
                  assert records == [], records
          PY
      - name: Verify independent media schema and exact project asset FK
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["CM_DB_DSN"]) as con:
              version=int(con.execute("show server_version_num").fetchone()[0])
              assert 170000<=version<180000
              assert con.execute("select to_regclass('mi_video_analyses')").fetchone()[0]
              row=con.execute("""select count(*) from pg_constraint
                where conrelid='mi_video_analyses'::regclass
                and contype='f'""").fetchone()
              assert row[0]>=3, row
              assert con.execute("select to_regclass('mi_brightdata_numeric_fields')").fetchone()[0]
              assert con.execute("""select count(*) from pg_constraint
                where conname='mi_video_analyses_method_version_check'
                and pg_get_constraintdef(oid) like '%%mi-abc-b8-native-media/v4%%'
              """).fetchone()[0]==1
              fk=con.execute("""select count(*) from pg_constraint where
                conrelid='mi_brightdata_numeric_fields'::regclass
                and contype='f'""").fetchone()[0]
              assert fk>=3, fk
          PY

  studio-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: carousel-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React and TypeScript
        run: npm install --no-audit --no-fund
      - name: Typecheck and build Studio
        run: npm run build
