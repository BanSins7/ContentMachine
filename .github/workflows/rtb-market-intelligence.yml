jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Compile Python integration
        run: python -m compileall -q app.py intelligence/market_intelligence intelligence/taxonomy_builder/market_intelligence_v3.py scripts/run_market_tests.py scripts/run_market_real100.py scripts/probe_market_carousel_one.py scripts/probe_market_video.py scripts/probe_market_group_b_live.py scripts/probe_market_group_b_window.py scripts/reconcile_market_group_b_reports.py scripts/probe_market_brightdata_one.py scripts/recover_market_brightdata_snapshots.py scripts/analyze_market_live_one_c.py scripts/check_market_test_schema.py scripts/check_market_live_project.py scripts/setup_market_group_a_models.py
      - name: Check JavaScript syntax
        run: node --check site/market-intelligence.js
      - name: Compile all copied A/B/C packages
        run: python -m compileall -q intelligence/market_intelligence/_copied
      - name: Market contract tests
        run: |
          python -m unittest discover -s tests -p "test_market_intelligence_*.py" -v
          python -m unittest discover -s tests -p "test_market_batch100.py" -v
          python -m unittest discover -s tests -p "test_market_post_source_selection.py" -v
          python -m unittest discover -s tests -p "test_market_tiktok_top100.py" -v
          python -m unittest discover -s tests -p "test_market_single_profile_c.py" -v
          python -m unittest discover -s tests -p "test_market_creative_export.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_vision_benchmark.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_story.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_studio.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_studio_settings.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_studio_accounts.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_studio_metric_timeout.py" -v
          python -m unittest discover -s tests -p "test_market_carousel_studio_analytics.py" -v
