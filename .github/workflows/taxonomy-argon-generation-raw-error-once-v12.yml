name: Argon Generation raw error v12 one-shot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taxonomy-argon-generation-raw-error-once-v12.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: taxonomy-argon-generation-v12-one-paid-diagnostic
  cancel-in-progress: false
jobs:
  one-argon-diagnostic:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore(test): launch one raw Argon Generation diagnostic v12'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Allow unique first run only; do not rerun potentially charged request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          THIS_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os,sys,json,urllib.request
          if os.environ['THIS_ATTEMPT']!='1':
              sys.exit('Rerun refused; paid attempt could already have been charged')
          uri='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/workflows/taxonomy-argon-generation-raw-error-once-v12.yml/runs?per_page=100'
          req=urllib.request.Request(uri,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=15) as response:
                  data=json.load(response)
          except Exception:
              sys.exit('Cannot verify uniqueness; no paid calls')
          rows=data.get('workflow_runs',[])
          if data.get('total_count')!=1 or len(rows)!=1 or str(rows[0].get('id'))!=os.environ['THIS_RUN']:
              sys.exit('Prior run detected; no paid calls')
          print('One-shot guard passed')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 1a077b8f9f965a59a392f86aeb617ec6aa497ef5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm immutable diagnostic code
        run: test "$(git rev-parse HEAD)" = '1a077b8f9f965a59a392f86aeb617ec6aa497ef5'
      - name: Install project dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Check exact source quotes offline
        run: |
          python - <<'PY'
          from scripts.taxonomy_argon_generation_diagnostic_once import synthetic_approved_facts
          facts=synthetic_approved_facts()
          assert len(facts)==10
          print('Synthetic 10 approved facts verified offline')
          PY
      - name: Exactly one Argon taxonomy-v2 High reasoning paid HTTP request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          RUN_ARGON_DIAG_ONCE: I_APPROVE_ONE_RAW_ARGON_GENERATION_20261020
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/taxonomy_argon_generation_diagnostic_once.py
      - name: Read raw provider status and sanitized body
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('taxonomy_argon_generation_diagnostic_once.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              for k in ('outcome','http_status','http_reason','raw_provider_error_body',
                        'exception_class','raw_exception','underlying_reason',
                        'usage','finish_reason','validation_error_message',
                        'valid_topic_count','reserved_usd'):
                  if k in d: print(k+':',d[k])
          else:
              print('No paid diagnostic report: preflight/one-shot guard stopped before request')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argon-generation-one-http-raw-error-v12-sanitized
          path: taxonomy_argon_generation_diagnostic_once.json
          if-no-files-found: ignore
