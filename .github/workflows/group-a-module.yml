name: Group A standalone (GA23 Windows/Linux PG17 compatibility matrix)
on:
  push:
    branches:
      - feature/group-a-full-module
    paths:
      - "intelligence/group_a/**"
      - "intelligence/migrations/054_group_a_module_core.sql"
      - "intelligence/migrations/055_group_a_handoff_inbox.sql"
      - "intelligence/migrations/056_group_a_immutable_video_snapshots.sql"
      - "intelligence/migrations/057_group_a_runtime_orchestration.sql"
      - "intelligence/migrations/058_group_a_api_observability.sql"
      - "intelligence/migrations/059_group_a_qdp_revocation_bridge.sql"
      - "tests/test_group_a_*.py"
      - "tests/fixtures/group_a_benchmark_*.json"
      - "scripts/benchmark_group_a.py"
      - "docs/GROUP_A_*"
      - ".github/workflows/group-a-module.yml"
  pull_request:
    paths:
      - "intelligence/group_a/**"
      - "intelligence/migrations/054_group_a_module_core.sql"
      - "intelligence/migrations/055_group_a_handoff_inbox.sql"
      - "intelligence/migrations/056_group_a_immutable_video_snapshots.sql"
      - "intelligence/migrations/057_group_a_runtime_orchestration.sql"
      - "intelligence/migrations/058_group_a_api_observability.sql"
      - "intelligence/migrations/059_group_a_qdp_revocation_bridge.sql"
      - "tests/test_group_a_*.py"
      - "tests/fixtures/group_a_benchmark_*.json"
      - "scripts/benchmark_group_a.py"
      - "docs/GROUP_A_*"
      - ".github/workflows/group-a-module.yml"
  workflow_dispatch:

# Multiple parallel edits can enqueue duplicate PR/push runs for Group A.
concurrency:
  group: group-a-module-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ga_ci_fixture_only
          POSTGRES_DB: ga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://postgres:ga_ci_fixture_only@localhost:5432/ga_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator (test-only)
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0 'psycopg[binary]==3.2.6' 'Pillow==11.1.0'
      - name: Require local FFmpeg and FFprobe for real-media regression
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: FFmpeg audio decoder format availability (no model download)
        run: |
          ffmpeg -hide_banner -encoders | grep -q pcm_s16le
          ffmpeg -hide_banner -decoders | grep -q pcm_s16le
          ffmpeg -hide_banner -filters | grep -q aresample
      - name: Provision local Tesseract OCR language packs for real regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus fonts-dejavu-core
          tesseract --version 2>&1 | head -n 1
          tesseract --list-langs 2>/dev/null | grep -E '^(eng|rus)$'
      # GA14 real MKV embedded SRT is generated locally with FFmpeg, no provider
      # GA15 model weights, human license approval and ONNX Runtime are opt-in.
      # Python fakes test the classifier contract, not production model accuracy.
      - name: Compile isolated Group A and every GA test
        run: python -m compileall -q intelligence/group_a tests/test_group_a_*.py
      - name: GA21 Studio JavaScript syntax (no browser execution claim)
        run: node --check intelligence/group_a/site/group-a.js
      - name: GA22 deterministic locally generated synthetic benchmark (not real-world gold)
        run: |
          RUN_DIR="$(mktemp -d)"
          python scripts/benchmark_group_a.py --output "$RUN_DIR/corpus" --repetitions 2
          python -c 'import json,sys; x=json.load(open(sys.argv[1],encoding="utf-8")); assert x["release_quality_gate"]=="NOT_VERIFIED"; assert x["real_asr_wer_cer"].startswith("NOT_MEASURED"); assert x["measurement"]["summary"]["invocations"] >= 8; assert not x["local_stage_measurements"]["full_pipeline_coverage"]' "$RUN_DIR/corpus/report.json"
      - name: Unit, offline media, and disposable PG17 migration smoke
        run: python -m unittest discover -s tests -p 'test_group_a_*.py' -v
      - name: Check no bootstrap QDP intake is silently enabled
        run: python -c "from intelligence.group_a.capabilities import live_handoff_ready; assert not live_handoff_ready()"
      - name: Validate all frozen v1 JSON Schemas (not only Python shape checks)
        run: python -m unittest discover -s tests -p 'test_group_a_contracts_v1.py' -v


  # GA23 native Windows smoke. No Windows PG17/peer E2E is claimed here.
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Windows test-only free/offline QA packages
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0" "Pillow==11.1.0" "psycopg[binary]==3.2.6"
      - name: Windows compile GA implementation and tests
        run: python -m compileall -q intelligence/group_a tests scripts/benchmark_group_a.py
      - name: Windows Studio JS syntax (not browser E2E)
        run: node --check intelligence/group_a/site/group-a.js
      - name: Windows isolated contracts, fake-peer and metrics
        run: |
          python -m unittest discover -s tests -p "test_group_a_contracts_v1.py" -v
          python -m unittest discover -s tests -p "test_group_a_e2e.py" -v
          python -m unittest discover -s tests -p "test_group_a_benchmark.py" -v
      - name: Disclose deliberately untested Windows domains
        run: |
          Write-Output 'Windows PostgreSQL 17: NOT RUN (no local DB service in this job)'
          Write-Output 'Cross-branch QDP/B/Analytics: NOT RUN; throwaway integration checkout required'
          Write-Output 'Human gold and production model accuracy: NOT RUN'

  # GA04 -> A003 -> GA19 -> B FAKE with disposable PostgreSQL 17;
  # cross-branch real B/QDP must be validated on a separate integration
  # checkout and is NOT implied by green fake-consumer tests.
  pg17-fresh-upgrade-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ga23_disposable_only
          POSTGRES_DB: ga23_disposable_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ga23_disposable_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://postgres:ga23_disposable_only@localhost:5432/ga23_disposable_ci
      CM_GA23_DISPOSABLE_ACK: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated Python QA dependencies
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.6" "Pillow==11.1.0" "jsonschema==4.23.0"
      - name: Compile GA23 and own Group A code
        run: python -m compileall -q intelligence/group_a tests/test_group_a_migration_matrix.py tests/test_group_a_e2e.py
      - name: PG17 fresh / upgrade / repeat / checksum tamper
        run: python -m unittest discover -s tests -p 'test_group_a_migration_matrix.py' -v
      - name: Real GA DB with fake QDP/B E2E
        run: python -m unittest discover -s tests -p 'test_group_a_e2e.py' -v
      - name: GA20 worker lease and delivery regressions
        run: |
          python -m unittest discover -s tests -p 'test_group_a_runtime.py' -v
          python -m unittest discover -s tests -p 'test_group_a_delivery.py' -v
      - name: Disclose non-covered external integrations
        run: |
          echo 'Results cover GA-owned PG17 and fake QDP/B callbacks ONLY.'
          echo 'Actual QDP, SRE/PSI, Group B, Analytics: NOT RUN without throwaway combined integration.'
          echo 'Windows PG17 and genuine RU/EN human-reviewed model accuracy: NOT RUN.'
