name: Search Planner SP-01 to SP-15A focused QA
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Multiple simultaneous module chats create dozens of outdated PR revisions.
# Keep the newest revision eligible without accumulating all old SP runner jobs.
concurrency:
  group: sp-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sp-01-sp-15a-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Verify SP source compiles
        run: python -m compileall -q intelligence/search_planner tests/test_search_planner_service_stage01.py tests/test_search_planner_stage02_compatibility.py tests/test_search_planner_generation_workflow_stage03.py tests/test_search_planner_operations_stage04.py tests/test_search_planner_stage05_provenance.py tests/test_search_planner_stage06_embeddings.py tests/test_search_planner_stage07_links.py tests/test_search_planner_stage08_registry.py tests/test_search_planner_stage09_capabilities.py tests/test_search_planner_stage10_task_planner.py tests/test_search_planner_stage10_approval.py tests/test_search_planner_stage11_handoff.py tests/test_search_planner_handoff_db.py tests/test_search_planner_collector_adapter.py tests/test_search_planner_http_api.py tests/test_search_planner_stage13_publications.py tests/test_search_planner_stage14_overview.py tests/test_search_planner_stage15_supervision.py tests/test_search_planner_stage15_leases.py tests/test_search_planner_stage13_paid_http.py tests/test_search_planner_stage13_config_idempotency.py
      - name: SP-01 service and isolation contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_service_stage01.py' -v
      - name: SP1-SP2 backward compatibility contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_foundation.py' -v
      - name: SP-02 approved C9 provenance and Deep V2 fail-closed tests
        run: python -m unittest discover -s tests -p 'test_search_planner_stage02_compatibility.py' -v
      - name: SP-03 generation run quote consent and owner-guard contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_generation_workflow_stage03.py' -v
      - name: Legacy SP3 cost estimate regression
        run: python -m unittest discover -s tests -p 'test_search_planner_engine_cost.py' -v
      - name: Legacy SP3 config/batch regression
        run: python -m unittest discover -s tests -p 'test_search_planner_engine_contracts.py' -v
      - name: SP-04 read-only operations and paid worker safety contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_operations_stage04.py' -v
      - name: Existing paid OpenRouter transport one-shot regression
        run: python -m unittest discover -s tests -p 'test_search_planner_stage_d.py' -v
      - name: Existing fake worker and financial ledger state regression
        run: python -m unittest discover -s tests -p 'test_search_planner_engine_stage_c.py' -v
      - name: SP-05 pinned AI Query and SQG candidate provenance
        run: python -m unittest discover -s tests -p 'test_search_planner_stage05_provenance.py' -v
      - name: SP-06 offline pinned embeddings and fixture isolation
        run: python -m unittest discover -s tests -p 'test_search_planner_stage06_embeddings.py' -v
      - name: Legacy QV semantic selection + QA fixture regression
        run: python -m unittest discover -s tests -p 'test_search_planner_query_validation.py' -v
      - name: SP-07 cross-hypothesis provenance and lossless MMR dedup
        run: python -m unittest discover -s tests -p 'test_search_planner_stage07_links.py' -v
      - name: SP-08 trusted QV accounting and durable consumer receipt gates
        run: python -m unittest discover -s tests -p 'test_search_planner_stage08_registry.py' -v
      - name: SP-09 source capability readiness and Collector-free matcher
        run: python -m unittest discover -s tests -p 'test_search_planner_stage09_capabilities.py' -v
      - name: SP-10 DB-trusted held task plan source/limits/cost/coverage
        run: python -m unittest discover -s tests -p 'test_search_planner_stage10_task_planner.py' -v
      - name: SP-10 immutable HELD plan owner approval and routing fairness
        run: python -m unittest discover -s tests -p 'test_search_planner_stage10_approval.py' -v
      - name: SP-11 complete QV handoff identity and 117-to-50+50+17 chunks
        run: python -m unittest discover -s tests -p 'test_search_planner_stage11_handoff.py' -v
      - name: SP-12 durable inbox/ACK, zero work and deterministic replay
        run: python -m unittest discover -s tests -p 'test_search_planner_handoff_db.py' -v
      - name: SP-12 optional Collector durable receipt, no blind retry
        run: python -m unittest discover -s tests -p 'test_search_planner_collector_adapter.py' -v
      - name: SP-13 owner-authenticated local HTTP and paid kill-switch guards
        run: python -m unittest discover -s tests -p 'test_search_planner_http_api.py' -v
      - name: SP-13 approved deep C9 publication picker verified source reads
        run: python -m unittest discover -s tests -p 'test_search_planner_stage13_publications.py' -v
      - name: SP-13 durable paid HTTP duplicate/crash/lost response barrier
        run: python -m unittest discover -s tests -p 'test_search_planner_stage13_paid_http.py' -v
      - name: SP-13 immutable generation config replay
        run: python -m unittest discover -s tests -p 'test_search_planner_stage13_config_idempotency.py' -v
      - name: SP-15B fenced durable lease, stolen owner and no-double-work rules
        run: python -m unittest discover -s tests -p 'test_search_planner_stage15_leases.py' -v
      - name: SP-15A read-only project metrics and no-paid inbox supervisor
        run: python -m unittest discover -s tests -p 'test_search_planner_stage15_supervision.py' -v
      - name: SP-14 project-scoped read-only history and cached model pins
        run: python -m unittest discover -s tests -p 'test_search_planner_stage14_overview.py' -v
      - name: SP-14 UI transport, safe token lifetime, policy, stage wiring and 6-pane model picker
        run: node --test tests/test_search_planner_ui.mjs
      - name: SP-14 full mocked DOM click-flow from C9 to QV and Inbox
        run: node --test tests/test_search_planner_ui_dom.mjs
