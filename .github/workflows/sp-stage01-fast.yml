name: Search Planner SP-01 focused QA
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sp-01-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Verify SP source compiles
        run: python -m compileall -q intelligence/search_planner tests/test_search_planner_service_stage01.py
      - name: SP-01 service and isolation contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_service_stage01.py' -v
      - name: SP1-SP2 backward compatibility contracts
        run: python -m unittest discover -s tests -p 'test_search_planner_foundation.py' -v
