name: Edema five full taxonomy E2Es v10 one-shot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taxonomy-edema-five-e2e-once-v10.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: taxonomy-edema-five-e2e-one-authorized-batch-v10
  cancel-in-progress: false
jobs:
  five-real-e2es:
    if: false # v10 one-shot has launched and is permanently disabled
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Refuse paid reruns and pre-existing workflow attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          THIS_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os,sys,urllib.request,json
          if os.environ['THIS_ATTEMPT']!='1':
              sys.exit('Never retry an already-charged batch')
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/workflows/taxonomy-edema-five-e2e-once-v10.yml/runs?per_page=100'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=15) as resp: data=json.load(resp)
          except Exception:
              sys.exit('Unable to verify one-shot uniqueness. No paid requests')
          rows=data.get('workflow_runs',[])
          if data.get('total_count')!=1 or len(rows)!=1 or str(rows[0].get('id'))!=os.environ['THIS_RUN']:
              sys.exit('Prior workflow attempt exists. No paid requests')
          print('One-shot paid workflow uniqueness verified')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 639ab0ae07e1e104fd4fa724a190120d2011ccff
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR feature commit (previously green)
        run: test "$(git rev-parse HEAD)" = '639ab0ae07e1e104fd4fa724a190120d2011ccff'
      - name: Install PostgreSQL Python dependency
        run: python -m pip install -r intelligence/requirements.txt
      - name: Run five real provider stages with isolated project records
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          CM_DB_ENABLED: '1'
          CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
          RUN_FIVE_EDEMA_E2E_ONCE: YES_ONE_EDEMA_MATRIX_20261020
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/taxonomy_edema_five_e2e.py
      - name: Print sanitized case summaries
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('taxonomy_edema_five_e2e_results.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              for row in d.get('tests',[]):
                  print(row['name'],row['status'],'full_pass=',row['run_success'],
                        'fact_count=',row.get('valid_facts',0),
                        'topics=',row.get('valid_topics',0),
                        'stages=',len(row['stages']),'reason=',row.get('reason',''))
              print('New reported USD:',d['new_known_spent_usd'])
              print('Historic+new reported USD:',d.get('known_total_usd','incomplete'))
              print('Unknown billing stop:',d['unknown_billing_stop'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxonomy-edema-five-full-E2E-v10-sanitized
          path: taxonomy_edema_five_e2e_results.json
          if-no-files-found: ignore
