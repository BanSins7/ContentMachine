name: Opus 5.5 only critic for edema v14 taxonomy v15 one-shot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taxonomy-edema-opus-critic-only-once-v15.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: opu-v15-only-original-edema-critic-first-attempt
  cancel-in-progress: false
jobs:
  single-critic:
    if: false # v15 one-shot Critic already launched; never repeat a billable call
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Block reruns and duplicate potentially charged workflow attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os,sys,json,urllib.request
          if os.environ["RUN_ATTEMPT"]!="1":
              sys.exit("DO NOT retry a potentially charged Critic")
          url="https://api.github.com/repos/"+os.environ["GH_REPO"]+"/actions/workflows/taxonomy-edema-opus-critic-only-once-v15.yml/runs?per_page=100"
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  d=json.load(r)
          except Exception:sys.exit("Cannot prove first run: no paid calls")
          rows=d.get("workflow_runs",[])
          if d.get("total_count")!=1 or len(rows)!=1 or str(rows[0].get("id"))!=os.environ["RUN_ID"]:
              sys.exit("Duplicate or previous run detected: no paid calls")
          print("First and only one-shot workflow confirmed")
          PY
      - uses: actions/checkout@v4
        with:
          ref: 6c67035c878490d2a744994c90927ff8f0f495f9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source commit exactly pinned
        run: test "$(git rev-parse HEAD)" = '6c67035c878490d2a744994c90927ff8f0f495f9'
      - name: Install project runtime
        run: python -m pip install -r intelligence/requirements.txt
      - name: Unpaid single-Critic regression tests
        run: python -m unittest discover -s tests -p 'test_taxonomy_edema_opus_critic_only.py' -v
      - name: One real Opus Critic on exact 12 categories from v14 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          RUN_ONE_OPUS_EDMA_CRITIC: YES_SINGLE_OPUS_CRITIC_20261020
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/taxonomy_edema_opus_critic_only_once.py
      - name: Print complete critic status and severities
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path("taxonomy_edema_opus_critic_only_v15_result.json")
          if not p.exists():sys.exit("No report: preflight did not complete")
          r=json.loads(p.read_text(encoding="utf-8"))
          for k in ("status","source_topic_count","approved_fact_count",
                    "openrouter_key_usage_before_usd","output_token_limit",
                    "conservative_reserved_usd","http_status","finish_reason",
                    "reported_cost_usd","findings_count","findings_by_severity",
                    "error_message","validation_error","original_provider_error"):
              if k in r:print(k+":",r[k])
          for f in r.get("findings",[]):
              print("FINDING:",f.get("severity"),f.get("topic_name"),
                    "issue:",f.get("issue"),"suggestion:",f.get("suggestion"))
          if r.get("status")!="critic_completed":
              sys.exit("Critic did not return fully valid complete JSON. No retries.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-critic-v15-on-original-12-edema-topics-sanitized
          path: taxonomy_edema_opus_critic_only_v15_result.json
          if-no-files-found: ignore
