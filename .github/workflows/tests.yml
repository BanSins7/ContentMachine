name: ContentMachine checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install infrastructure dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: PostgreSQL migrations
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: CM_DB_DSN="$CM_TEST_PG_DSN" python -m intelligence.migrate
      - name: Python regression tests
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m unittest discover -s tests -v
      - name: JS syntax check
        run: node --check site/app.js && node --check site/discovery.js && node --check site/projects.js
      - name: Python syntax check
        run: python -m compileall -q app.py projects.py worker/ intelligence/
