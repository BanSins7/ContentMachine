name: ContentMachine checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install infrastructure dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: PostgreSQL migrations
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: CM_DB_DSN="$CM_TEST_PG_DSN" python -m intelligence.migrate
      - name: Collector VC-MOD-00 integration baseline
        run: python -m unittest discover -s tests -p 'test_video_collector_integration_baseline.py' -v
      - name: Video Collector VC-MOD-01 contracts and lazy adapters
        run: python -m unittest discover -s tests -p 'test_video_collector_ports_v1.py' -v && python -m unittest discover -s tests -p 'test_video_collector_adapters_v1.py' -v
      - name: Video Collector VC-MOD-02 PG17 schemas and migration preflight
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m unittest discover -s tests -p 'test_video_collector_schema_v1.py' -v && python -m unittest discover -s tests -p 'test_video_collector_schema_audit.py' -v
      - name: Video Collector VC-MOD-03 trusted QV Reader QA
        run: python -m unittest discover -s tests -p 'test_video_collector_qv_reader_v1.py' -v
      - name: Video Collector VC-MOD-04 durable QV publisher and replay
        run: python -m unittest discover -s tests -p 'test_video_collector_qv_publisher_v1.py' -v
      - name: Python regression tests
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m unittest discover -s tests -v
      - name: PSI Stage14 release gate (migrations, integrity, baseline)
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m scripts.psi_release_gate --strict-ci
      - name: JS syntax check
        run: node --check site/app.js && node --check site/discovery.js && node --check site/dtk-tool.js && node --check site/projects.js && node --check site/project-sources.js && node --check site/research-files.js && node --check site/document-extraction.js && node --check site/web-sources.js && node --check site/video-sources.js && node --check site/transcription-sources.js && node --check site/vision-sources.js && node --check site/fusion-sources.js && node --check site/evidence-sources.js && node --check site/project-context.js && node --check site/project-activity.js && node --check site/context-quote.js && node --check site/taxonomy-studio.js && node --check site/taxonomy-cost.js && node --check site/taxonomy-run.js && node --check site/taxonomy-deep.js
      - name: Taxonomy Studio UI behavior
        run: node tests/test_taxonomy_studio_ui.cjs
      - name: Taxonomy cost and consent UI behavior
        run: node tests/test_taxonomy_cost_ui.cjs
      - name: Stage13 context approval and budget UI
        run: node tests/test_context_stage13_ui.cjs
      - name: Stage13 persisted source activity UI
        run: node tests/test_source_activity_stage13_ui.cjs
      - name: Taxonomy Builder run human gates UI
        run: node tests/test_taxonomy_run_ui.cjs
      - name: Deep taxonomy human review and final tree UI
        run: node tests/test_taxonomy_deep_ui.cjs
      - name: Python syntax check
        run: python -m compileall -q app.py projects.py worker/ intelligence/ scripts/taxonomy_live_e2e.py
