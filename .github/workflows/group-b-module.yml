name: Group B standalone module
on:
  push:
    branches:
      - feature/group-b-full-module
  pull_request:
    paths:
      - "intelligence/group_b/**"
      - "tests/test_group_b_*.py"
      - "docs/GROUP_B_*"
      - ".github/workflows/group-b-module.yml"
jobs:
  pure-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pure Group B bootstrap tests
        run: python -m unittest discover -s tests -p "test_group_b_foundation.py" -v
      - name: Frozen B1-B8 contracts and negative cases (GB-MOD-01)
        run: python -m unittest discover -s tests -p "test_group_b_contracts.py" -v
      - name: Independent schema 005 drift/trigger/index/source-first audit (GB-MOD-01)
        run: python -m unittest discover -s tests -p "test_group_b_schema_audit.py" -v
      - name: Stage 02 standalone ports (no network or paid calls)
        run: python -m unittest discover -s tests -p "test_group_b_ports.py" -v
      - name: Stage 03 schema static checks (PG tests skip without DSN)
        run: python -m unittest discover -s tests -p "test_group_b_db.py" -v
      - name: Stage 04 pure QDP handoff/ACK tests
        run: python -m unittest discover -s tests -p "test_group_b_qdp.py" -v
      - name: Stage 04 PostgreSQL tests (skip without DSN)
        run: python -m unittest discover -s tests -p "test_group_b_qdp_db.py" -v
      - name: Stage 05 Group A exact-version adapter regression suite
        run: python -m unittest discover -s tests -p "test_group_b_a.py" -v
      - name: Stage 06 media bytes, evidence provenance, timebases and manifest
        run: python -m unittest discover -s tests -p "test_group_b_evidence.py" -v
      - name: Stage 07 B1-B8 readiness and fresh QDP/A/media authorization
        run: python -m unittest discover -s tests -p "test_group_b_readiness.py" -v
      - name: Stage 08 context budgets, media coverage, Unicode and hostile OCR
        run: python -m unittest discover -s tests -p "test_group_b_context.py" -v
      - name: Stage 09 OpenRouter model capabilities, mock HTTP and strict JSON
        run: python -m unittest discover -s tests -p "test_group_b_provider.py" -v
      - name: Stage 10 pure USD quote and budget ledger schema checks
        run: python -m unittest discover -s tests -p "test_group_b_budget.py" -v
      - name: Stage 10 budget database suite (skip without DSN)
        run: python -m unittest discover -s tests -p "test_group_b_budget_db.py" -v
      - name: Stage 11 worker DAG, lease/fencing, dry-run and paid denial
        run: python -m unittest discover -s tests -p "test_group_b_jobs.py" -v
      - name: Stage 11 PG17 tests skip without a disposable DSN
        run: python -m unittest discover -s tests -p "test_group_b_jobs_db.py" -v
      - name: Stage 12 locally verified B5 montage and strict SQL005 cut-rate boundaries
        run: python -m unittest discover -s tests -p "test_group_b_b5.py" -v
      - name: Existing B schema static tests (DB tests skip without DSN)
        run: python -m unittest discover -s tests -p "test_content_features_b_schema.py" -v

  postgres-17-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gb_test
          POSTGRES_PASSWORD: gb_test
          POSTGRES_DB: cm_group_b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb_test -d cm_group_b_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CM_TEST_PG_DSN: postgresql://gb_test:gb_test@127.0.0.1:5432/cm_group_b_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database driver (no LLM keys)
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Full migration upgrade and Group B PG17 isolation
        run: python -m unittest discover -s tests -p "test_group_b_db.py" -v
      - name: Stage 04 PostgreSQL real B inbox/receipt/ACK tests (stub producer)
        run: python -m unittest discover -s tests -p "test_group_b_qdp_db.py" -v
      - name: Stage 06 local media evidence tests (no peer or FFmpeg dependency)
        run: python -m unittest discover -s tests -p "test_group_b_evidence.py" -v
      - name: Stage 07 read-only eligibility and revocation regression
        run: python -m unittest discover -s tests -p "test_group_b_readiness.py" -v
      - name: Stage 08 bounded context serialization and sampling tests
        run: python -m unittest discover -s tests -p "test_group_b_context.py" -v
      - name: Stage 09 paid-provider disabled, catalog and response negative QA
        run: python -m unittest discover -s tests -p "test_group_b_provider.py" -v
      - name: Stage 10 pure quote cap/expiry/cost negative tests
        run: python -m unittest discover -s tests -p "test_group_b_budget.py" -v
      - name: Stage 10 real PG17 spend ledger and concurrent reservation tests
        run: python -m unittest discover -s tests -p "test_group_b_budget_db.py" -v
      - name: Stage 11 worker DAG and fencing pure tests
        run: python -m unittest discover -s tests -p "test_group_b_jobs.py" -v
      - name: Stage 11 real PG17 two-worker race, lease theft, cancel and recovery
        run: python -m unittest discover -s tests -p "test_group_b_jobs_db.py" -v
      - name: Stage 12 B5 verified shot segment calculations and worker integration
        run: python -m unittest discover -s tests -p "test_group_b_b5.py" -v
      - name: Original 005 B schema tests against PostgreSQL 17
        run: python -m unittest discover -s tests -p "test_content_features_b_schema.py" -v
