name: PIE standalone module
on:
  push:
    branches: [feature/patterns-insights-full-module]
  pull_request:
    paths:
      - "intelligence/patterns_insights/**"
      - "intelligence/migrations/200_pie_*.sql"
      - "tests/test_pie_*.py"
      - "docs/PIE_*"
      - ".github/workflows/pie-module.yml"
jobs:
  bootstrap-unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pure PIE and static SQL contract tests
        run: python -m unittest discover -s tests -p "test_pie_*.py" -v
      - name: Python source compilation
        run: python -m compileall -q intelligence/patterns_insights
  postgres17-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pie_test
          POSTGRES_PASSWORD: pie_test
          POSTGRES_DB: pie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pie_test -d pie_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test PostgreSQL client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create empty upgrade test database
        env:
          PGPASSWORD: pie_test
        run: psql -h 127.0.0.1 -U pie_test -d pie_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE pie_upgrade_test"
      - name: Fresh-install + existing-main upgrade + isolated PIE regression
        env:
          CM_TEST_PG_DSN: postgresql://pie_test:pie_test@127.0.0.1:5432/pie_test
          CM_TEST_PG_UPGRADE_DSN: postgresql://pie_test:pie_test@127.0.0.1:5432/pie_upgrade_test
        run: python -m unittest discover -s tests -p "test_pie_db_schema.py" -v
