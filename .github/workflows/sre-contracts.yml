  pull_request:
    paths:
      - 'intelligence/relevance/v1_*.py'
      - 'intelligence/relevance/module.py'
      - 'intelligence/relevance/config.py'
      - 'intelligence/relevance/health.py'
      - 'intelligence/relevance/http_api.py'
      - 'intelligence/relevance/migration_guard.py'
      - 'app.py'
      - 'site/sre-studio.*'
      - 'intelligence/relevance/ports/*.py'
      - 'tests/test_sre_*.py'
      - 'intelligence/relevance/taxonomy_*.py'
      - 'intelligence/relevance/hypothesis_context.py'
      - 'intelligence/relevance/intake.py'
      - 'intelligence/relevance/content_builder.py'
      - 'intelligence/relevance/source_policy.py'
      - 'intelligence/relevance/live_content_gate.py'
