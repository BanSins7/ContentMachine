      - 'docs/SRE_M38_LOCAL_READ_ONLY_API.md'
      - 'tests/test_sre_collector_inbox_adapter.py'
      - 'tests/test_sre_peer_contract_audit.py'
      - 'docs/SRE_M37_PEER_INTEGRATION_REPORT.md'
      - 'intelligence/migrations/068_sre_live_source_revocation.sql'
      - 'intelligence/migrations/069_sre_collector_inbox.sql'
      - 'intelligence/migrations/070_sre_live_result_outbox.sql'
      - 'intelligence/migrations/067_sre_live_gold_benchmarks.sql'
      - 'intelligence/migrations/066_sre_live_human_reviews.sql'
      - 'intelligence/migrations/065_sre_live_diagnostic_checkpoints.sql'
      - 'intelligence/migrations/064_sre_live_verified_coverage.sql'
      - 'intelligence/migrations/063_sre_live_opus_reconciliation.sql'
      - 'intelligence/migrations/062_sre_live_opus_receipts.sql'
      - 'intelligence/migrations/061_sre_live_opus_dispatch_intents.sql'
      - 'intelligence/migrations/060_sre_live_budget_ledger.sql'
      - 'intelligence/migrations/059_sre_live_opus_consents.sql'
      - 'intelligence/migrations/058_sre_live_opus_quotes.sql'
      - 'intelligence/relevance/requirements-local-embedding.txt'
      - 'intelligence/migrations/016_sre_d1_intake_rights.sql'
      - 'intelligence/migrations/017_sre_offline_run_engine.sql'
      - 'intelligence/migrations/054_sre_live_core.sql'
      - 'intelligence/migrations/055_sre_live_batch_coverage.sql'
      - 'intelligence/migrations/056_sre_live_dispatch_fences.sql'
      - 'intelligence/migrations/057_sre_local_embedding_cache.sql'
