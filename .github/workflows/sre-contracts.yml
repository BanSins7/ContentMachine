      - 'intelligence/relevance/live_lease.py'
      - 'intelligence/relevance/live_recovery.py'
      - 'intelligence/relevance/local_embedding.py'
      - 'intelligence/relevance/local_embedding_health.py'
      - 'intelligence/relevance/live_leaf_ranking.py'
      - 'intelligence/relevance/local_embedding_cache.py'
      - 'intelligence/relevance/live_classifier_context.py'
      - 'intelligence/relevance/opus_request_packer.py'
      - 'intelligence/relevance/opus_evidence_verifier.py'
      - 'intelligence/relevance/opus_catalog_preflight.py'
      - 'intelligence/relevance/opus_final_quote.py'
      - 'intelligence/relevance/opus_consent.py'
      - 'intelligence/relevance/opus_budget.py'
      - 'intelligence/relevance/opus_dispatch_intent.py'
      - 'intelligence/relevance/opus_transport.py'
      - 'intelligence/relevance/opus_receipt.py'
      - 'intelligence/relevance/opus_reconciliation.py'
      - 'intelligence/relevance/live_verified_coverage.py'
      - 'intelligence/relevance/live_diagnostics.py'
      - 'intelligence/relevance/live_human_review.py'
