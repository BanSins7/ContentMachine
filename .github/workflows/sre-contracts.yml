name: SRE V1 S1-S4 and M02-M03 module readiness
on:
  pull_request:
    paths:
      - 'intelligence/relevance/v1_*.py'
      - 'intelligence/relevance/module.py'
      - 'intelligence/relevance/config.py'
      - 'intelligence/relevance/health.py'
      - 'intelligence/relevance/ports/*.py'
      - 'tests/test_sre_*.py'
      - 'intelligence/relevance/taxonomy_*.py'
      - 'intelligence/relevance/hypothesis_context.py'
      - 'intelligence/relevance/intake.py'
      - 'intelligence/relevance/content_builder.py'
      - 'intelligence/relevance/source_policy.py'
      - 'intelligence/migrations/016_sre_d1_intake_rights.sql'
      - 'intelligence/migrations/017_sre_offline_run_engine.sql'
      - 'intelligence/relevance/offline_*.py'
      - '.github/workflows/sre-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'intelligence/relevance/v1_*.py'
      - 'tests/test_sre_*.py'
      - 'intelligence/relevance/taxonomy_*.py'
      - 'intelligence/relevance/hypothesis_context.py'
      - '.github/workflows/sre-contracts.yml'
permissions:
  contents: read
jobs:
  sre-contracts:
    name: Offline S1-S4 + M02-M03 readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new contract modules
        run: python -m compileall -q intelligence/relevance tests/test_sre_contracts_v1.py
      - name: Run SRE V1 contract regression suite (no DB, no network, no paid calls)
        run: python -m unittest discover -s tests -p test_sre_contracts_v1.py -v && python -m unittest discover -s tests -p test_sre_taxonomy_adapter.py -v && python -m unittest discover -s tests -p test_sre_intake_unit.py -v && python -m unittest discover -s tests -p test_sre_offline_unit.py -v && python -m unittest discover -s tests -p test_sre_module_ports.py -v && python -m unittest discover -s tests -p test_sre_runtime_config.py -v

  sre-taxonomy-postgres:
    name: S2-S4 PostgreSQL verified runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
      CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver and runtime infrastructure
        run: python -m pip install -r intelligence/requirements.txt
      - name: Apply existing versioned migrations without changing checksums
        run: python -m intelligence.migrate
      - name: PostgreSQL RTB->SRE human-reviewed integration fixture
        run: python -m unittest discover -s tests -p test_sre_taxonomy_adapter_pg.py -v
      - name: PostgreSQL S3 intake, rights and revision tests
        run: python -m unittest discover -s tests -p test_sre_intake_pg.py -v
      - name: PostgreSQL S4 durable offline run, crash and lease tests
        run: python -m unittest discover -s tests -p test_sre_offline_pg.py -v
      - name: PostgreSQL M03 operational read-only health preflight
        run: python -m unittest discover -s tests -p test_sre_health_pg.py -v
