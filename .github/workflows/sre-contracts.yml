name: SRE V1 S1-S4 and M02-M22 standalone
on:
  pull_request:
    paths:
      - 'intelligence/relevance/v1_*.py'
      - 'intelligence/relevance/module.py'
      - 'intelligence/relevance/config.py'
      - 'intelligence/relevance/health.py'
      - 'intelligence/relevance/http_api.py'
      - 'intelligence/relevance/migration_guard.py'
      - 'app.py'
      - 'site/sre-studio.*'
      - 'intelligence/relevance/ports/*.py'
      - 'tests/test_sre_*.py'
      - 'intelligence/relevance/taxonomy_*.py'
      - 'intelligence/relevance/hypothesis_context.py'
      - 'intelligence/relevance/intake.py'
      - 'intelligence/relevance/content_builder.py'
      - 'intelligence/relevance/source_policy.py'
      - 'intelligence/relevance/live_content_gate.py'
      - 'intelligence/relevance/dataset_preview.py'
      - 'intelligence/relevance/live_fsm.py'
      - 'intelligence/relevance/live_planner.py'
      - 'intelligence/relevance/live_batch_manifest.py'
      - 'intelligence/relevance/live_lease.py'
      - 'intelligence/relevance/live_recovery.py'
      - 'intelligence/relevance/local_embedding.py'
      - 'intelligence/relevance/local_embedding_health.py'
      - 'intelligence/relevance/live_leaf_ranking.py'
      - 'intelligence/relevance/local_embedding_cache.py'
      - 'intelligence/relevance/live_classifier_context.py'
      - 'intelligence/relevance/opus_request_packer.py'
      - 'intelligence/relevance/opus_evidence_verifier.py'
      - 'intelligence/relevance/opus_catalog_preflight.py'
      - 'intelligence/relevance/requirements-local-embedding.txt'
      - 'intelligence/migrations/016_sre_d1_intake_rights.sql'
      - 'intelligence/migrations/017_sre_offline_run_engine.sql'
      - 'intelligence/migrations/054_sre_live_core.sql'
      - 'intelligence/migrations/055_sre_live_batch_coverage.sql'
      - 'intelligence/migrations/056_sre_live_dispatch_fences.sql'
      - 'intelligence/migrations/057_sre_local_embedding_cache.sql'
      - 'intelligence/relevance/offline_*.py'
      - '.github/workflows/sre-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'intelligence/relevance/v1_*.py'
      - 'tests/test_sre_*.py'
      - 'intelligence/relevance/taxonomy_*.py'
      - 'intelligence/relevance/hypothesis_context.py'
      - '.github/workflows/sre-contracts.yml'
permissions:
  contents: read
jobs:
  sre-contracts:
    name: Offline S1-S4 + M02-M22 contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new contract modules
        run: python -m compileall -q intelligence/relevance tests/test_sre_contracts_v1.py
      - name: Run SRE V1 contract regression suite (no DB, no network, no paid calls)
        run: python -m unittest discover -s tests -p test_sre_contracts_v1.py -v && python -m unittest discover -s tests -p test_sre_taxonomy_adapter.py -v && python -m unittest discover -s tests -p test_sre_intake_unit.py -v && python -m unittest discover -s tests -p test_sre_offline_unit.py -v && python -m unittest discover -s tests -p test_sre_module_ports.py -v && python -m unittest discover -s tests -p test_sre_runtime_config.py -v && python -m unittest discover -s tests -p test_sre_psi_gate_compat.py -v && python -m unittest discover -s tests -p test_sre_migration_guard.py -v && python -m unittest discover -s tests -p test_sre_c9_approved_port.py -v && python -m unittest discover -s tests -p test_sre_d1_provenance.py -v && python -m unittest discover -s tests -p test_sre_live_content_gate.py -v && python -m unittest discover -s tests -p test_sre_dataset_preview.py -v && python -m unittest discover -s tests -p test_sre_live_fsm.py -v && python -m unittest discover -s tests -p test_sre_live_schema.py -v && python -m unittest discover -s tests -p test_sre_live_planner.py -v && python -m unittest discover -s tests -p test_sre_live_batch_manifest.py -v && python -m unittest discover -s tests -p test_sre_live_coverage_schema.py -v && python -m unittest discover -s tests -p test_sre_live_lease.py -v && python -m unittest discover -s tests -p test_sre_live_recovery.py -v && python -m unittest discover -s tests -p test_sre_live_recovery_schema.py -v && python -m unittest discover -s tests -p test_sre_local_embedding.py -v && python -m unittest discover -s tests -p test_sre_live_leaf_ranking.py -v && python -m unittest discover -s tests -p test_sre_local_embedding_cache.py -v && python -m unittest discover -s tests -p test_sre_local_embedding_cache_schema.py -v && python -m unittest discover -s tests -p test_sre_live_classifier_context.py -v && python -m unittest discover -s tests -p test_sre_opus_request_packer.py -v && python -m unittest discover -s tests -p test_sre_opus_evidence_verifier.py -v && python -m unittest discover -s tests -p test_sre_opus_catalog_preflight.py -v

  sre-taxonomy-postgres:
    name: S2-S4 plus M05-M22 PostgreSQL verified runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
      CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver and runtime infrastructure
        run: python -m pip install -r intelligence/requirements.txt
      - name: Apply existing versioned migrations without changing checksums
        run: python -m intelligence.migrate
      - name: PostgreSQL RTB->SRE human-reviewed integration fixture
        run: python -m unittest discover -s tests -p test_sre_taxonomy_adapter_pg.py -v
      - name: PostgreSQL S3 + M07-M08 intake, rights, expiry and D1 lineage
        run: python -m unittest discover -s tests -p test_sre_intake_pg.py -v
      - name: PostgreSQL S4 + M08-M22 exact Opus5.5 catalog/endpoint/price preflight and strict D1/C9/source rights regressions
        run: python -m unittest discover -s tests -p test_sre_offline_pg.py -v
      - name: PostgreSQL M03 operational read-only health preflight
        run: python -m unittest discover -s tests -p test_sre_health_pg.py -v
      - name: SRE M05/M11/M13/M15 PostgreSQL17 migration fresh/main-only upgrade/056 compatibility
        run: python -m unittest discover -s tests -p test_sre_migration_guard_pg.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SRE M04 localhost HTTP and static frontend smoke
        run: python -m unittest discover -s tests -p test_sre_bootstrap_http.py -v && node --check site/sre-studio.js
