name: Opus 5.5 one Critic from verified v14 topics v16
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taxonomy-edema-opus-critic-only-once-v16.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: opus-critic-original-edema-v16-one-try
  cancel-in-progress: false
jobs:
  one-critic:
    if: false # v16 one-shot launched; permanently blocked against paid reruns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the only possible paid workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,sys,json,urllib.request
          if os.environ['RUN_ATTEMPT']!='1':sys.exit('Paid rerun refused')
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/workflows/taxonomy-edema-opus-critic-only-once-v16.yml/runs?per_page=100'
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r: obj=json.load(r)
          except Exception:sys.exit('Cannot prove unique run; zero paid calls')
          rows=obj.get('workflow_runs',[])
          if obj.get('total_count')!=1 or len(rows)!=1 or str(rows[0].get('id'))!=os.environ['RUN_ID']:
              sys.exit('Existing run detected; zero paid calls')
          print('Verified single first run')
          PY
      - uses: actions/checkout@v4
        with:
          ref: c9805fc6adf771acab5b4523a4b8ecc720890f87
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure exact pinned feature source
        run: test "$(git rev-parse HEAD)" = 'c9805fc6adf771acab5b4523a4b8ecc720890f87'
      - name: Install dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Free isolated unit tests
        run: python -m unittest discover -s tests -p 'test_taxonomy_edema_opus_critic_only.py' -v
      - name: Download exact original v14 12-category research (no API usage)
        uses: actions/download-artifact@v4
        with:
          name: taxonomy-edema-mimo-flash-opus-full-E2E-v14-sanitized
          repository: BanSins7/ContentMachine
          run-id: 39451763589
          github-token: ${{ github.token }}
          path: previous_research
      - name: Verify exact content digest before paid request
        run: |
          python - <<'PY'
          import hashlib,sys,json
          from pathlib import Path
          p=Path('previous_research/taxonomy_edema_mimo_flash_opus_full_result.json')
          if not p.exists():sys.exit('Original research not downloaded; zero model calls')
          b=p.read_bytes()
          actual=hashlib.sha256(b).hexdigest()
          expected='055a98afd084c6e7292051d8f58bd1f86b7787937d38c64f901c342dcc11cbe2'
          if actual!=expected:sys.exit('SHA256 mismatch; zero paid calls')
          obj=json.loads(b)
          assert len(obj['tests'][0]['generated_topics_full'])==12
          print('Exact v14 original twelve topics verified')
          PY
      - name: Invoke exactly ONE Opus 5.5 Critic with 5k to 8k output tokens
        env:
          SOURCE_V14_FILE: previous_research/taxonomy_edema_mimo_flash_opus_full_result.json
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          RUN_ONE_OPUS_EDMA_CRITIC: YES_SINGLE_OPUS_CRITIC_20261020
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/taxonomy_edema_opus_critic_only_once.py
      - name: Save and print actual critic findings
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('taxonomy_edema_opus_critic_only_v15_result.json')
          if not p.exists():sys.exit('No critic result persisted: preflight stopped')
          r=json.loads(p.read_text(encoding='utf-8'))
          for k in ('status','paid_request_sent','source_topic_count','approved_fact_count',
                    'openrouter_key_usage_before_usd','output_token_limit',
                    'conservative_reserved_usd','http_status','finish_reason',
                    'reported_cost_usd','findings_count','findings_by_severity',
                    'error_message','validation_error','original_provider_error'):
              if k in r:print(k+':',r[k])
          for f in r.get('findings',[]):
              print('FINDING:',f['severity'],f['topic_name'],
                    'ISSUE:',f['issue'],'SUGGESTION:',f['suggestion'])
          if r.get('status')!='critic_completed':sys.exit('Incomplete Critic or preflight. No retry.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opus-critic-original-edema-topics-v16-full-findings
          path: taxonomy_edema_opus_critic_only_v15_result.json
          if-no-files-found: ignore
