name: Edema five corrected taxonomy E2Es v11 one-shot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/taxonomy-edema-five-e2e-once-v11.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: taxonomy-edema-v11-one-time-paid-corrected-batch
  cancel-in-progress: false

jobs:
  one-shot-five-cases:
    if: false # v11 authorized paid run already launched; disable future runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Verify this is the unique first paid run and not a rerun
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          THIS_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os,json,sys,urllib.request
          if os.environ['THIS_ATTEMPT']!='1':sys.exit('No paid reruns')
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/workflows/taxonomy-edema-five-e2e-once-v11.yml/runs?per_page=100'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=15) as resp: data=json.load(resp)
          except Exception:sys.exit('Cannot check previous runs; no paid calls')
          rows=data.get('workflow_runs',[])
          if data.get('total_count')!=1 or len(rows)!=1 or str(rows[0].get('id'))!=os.environ['THIS_RUN']:
              sys.exit('Not the single authorized first run; zero paid calls')
          print('Unique run verified')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 8b44341cc8daf3bfc16c11eae4ce43e03ce65a8c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned green code
        run: test "$(git rev-parse HEAD)" = '8b44341cc8daf3bfc16c11eae4ce43e03ce65a8c'
      - name: Install dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Real fixed models, updated compact facts v2, five cases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTERKEY }}
          CM_DB_ENABLED: '1'
          CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
          RUN_FIVE_EDEMA_E2E_ONCE: YES_ONE_EDEMA_MATRIX_20261020
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/taxonomy_edema_five_e2e.py
      - name: Report stages and fail if all requested full E2Es did not pass
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('taxonomy_edema_five_e2e_v11_results.json')
          if not p.exists():sys.exit('No persisted report; no success claim')
          d=json.loads(p.read_text(encoding='utf-8'))
          for row in d['tests']:
              print(row['name'],row['status'],
                    'full_pass=',row.get('run_success'),
                    'verified_facts=',row.get('valid_facts',0),
                    'topics=',row.get('valid_topics',0),
                    'stages=',len(row['stages']),
                    'reason=',row.get('reason',''))
          print('New known USD:',d['new_known_spent_usd'])
          print('Known total USD:',d.get('known_total_usd','incomplete'))
          if not d.get('finished') or len(d['tests'])!=5 or any(not x['run_success'] for x in d['tests']):
              sys.exit('Not all five complete; artifact holds truthful stage outcomes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxonomy-edema-five-full-E2E-v11-sanitized
          path: taxonomy_edema_five_e2e_v11_results.json
          if-no-files-found: ignore
