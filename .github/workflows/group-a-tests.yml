name: Group A technical extraction
on:
  pull_request:
    paths:
      - 'intelligence/group_a/**'
      - 'intelligence/migrations/017_group_a_technical_extraction.sql'
      - 'tests/test_group_a_*.py'
      - 'site/qualified-data.js'
      - 'app.py'
      - '.github/workflows/group-a-tests.yml'
  workflow_dispatch:
jobs:
  group_a:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DB dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: PostgreSQL 17 additive migrations
        env:
          CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m intelligence.migrate
      - name: Group A contract + QDP integration tests
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m unittest discover -s tests -p 'test_group_a_*.py' -v
      - name: Python and browser syntax
        run: python -m compileall -q intelligence/group_a && node --check site/qualified-data.js
