name: RTB module contract regression
on:
  pull_request:
    paths:
      - 'intelligence/taxonomy_builder/**'
      - 'tests/test_taxonomy*.py'
      - 'tests/test_taxonomy*.cjs'
      - 'app.py'
      - 'site/taxonomy-*.js'
      - 'site/taxonomy-workspace.css'
      - 'docs/RTB_*.md'
      - '.github/workflows/rtb-module-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtb-contract-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: New B9 and A8 Deep V2 contract tests (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_c_corrector_contracts.py' -v
      - name: Frozen A8 plus B9 Research Input tests (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_research_input.py' -v
      - name: Existing Flat V1 and Deep V1 pure contract tests
        run: |
          python -m unittest discover -s tests -p 'test_taxonomy_deep_contracts.py' -v
          python -m unittest discover -s tests -p 'test_taxonomy_builder_run.py' -v
      - name: Deep V2 nonpayable lifecycle contract tests (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_lifecycle.py' -v
      - name: Strict Deep V2 exact prompt and nonpaid quote smoke tests
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_quote.py' -v
      - name: Strict Deep V2 reference, graph, signal and product-claim validation
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_validation.py' -v
      - name: V2 one-call provider offline test, unknown cost and no retry
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_provider.py' -v
      - name: Deep V2 Review1 decisions and Pass2 H1 lock (offline)
        run: |
          python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_review.py' -v
          python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_followup.py' -v
      - name: Catch RTB PL/pgSQL dollar quoting mistakes before PostgreSQL
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_sql_static.py' -v
      - name: Explicit Deep V2 expansion prompt and consent transport (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_expansion.py' -v
      - name: Deep V2 deterministic Search Readiness (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_readiness.py' -v
      - name: Deep V2 SQL readiness/review2 static guards
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_sql_static.py' -v
      - name: B9-derived exact 14-field V2 to 11-field V1 SRE projection (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_sre_projection.py' -v
      - name: Versioned RTB read-only export and actual Search Planner V1 adapter (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_publication_export_v2.py' -v
      - name: Deep V2 origin/reviewer/payment HTTP security (offline)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_http.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deep V2 real browser controller complete mocked B9 flow (no provider)
        run: node tests/test_taxonomy_deep_v2_ui.cjs
      - name: RTB Python static compile
        run: python -m compileall -q intelligence/taxonomy_builder/ tests/test_taxonomy_c_corrector_contracts.py

  rtb-contract-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: B9 to RTB pinned-source contract regression (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_c_corrector_contracts.py -v
      - name: Frozen A8 plus B9 Research Input tests (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_research_input.py -v
      - name: Deep V2 nonpayable lifecycle contract tests (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_lifecycle.py -v
      - name: Strict Deep V2 exact prompt and nonpaid quote smoke tests
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_quote.py -v
      - name: Strict Deep V2 reference and product-claim validation
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_validation.py -v
      - name: V2 single-call provider offline test and no retry
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_provider.py -v
      - name: Deep V2 Review1 decisions and Pass2 H1 lock (offline)
        run: |
          python -m unittest discover -s tests -p test_taxonomy_deep_v2_review.py -v
          python -m unittest discover -s tests -p test_taxonomy_deep_v2_followup.py -v
          python -m unittest discover -s tests -p test_taxonomy_deep_v2_sql_static.py -v
      - name: Explicit Deep V2 expansion prompt and consent transport (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_expansion.py -v
      - name: Deep V2 deterministic Search Readiness and H2 contracts
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_readiness.py -v
      - name: B9-derived exact V2/V1 core and immutable SRE projection (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_sre_projection.py -v
      - name: Versioned RTB export, unsupported versions and Search Planner V1 adapter (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_publication_export_v2.py -v
      - name: Deep V2 origin/reviewer/payment HTTP security (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_deep_v2_http.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deep V2 browser controls with mocked pay/review actions
        run: node tests/test_taxonomy_deep_v2_ui.cjs
      - name: Legacy deep contract regression (offline)
        run: python -m unittest discover -s tests -p test_taxonomy_deep_contracts.py -v

  rtb-postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
      CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Apply all PostgreSQL 17 migrations
        run: python -m intelligence.migrate
      - name: Verify B8/B9 to RTB read-only service on actual PostgreSQL
        run: python -m unittest discover -s tests -p 'test_taxonomy_research_input_db.py' -v
      - name: Verify Deep V2 B9/A8 immutable binding in PostgreSQL17
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_binding_db.py' -v
      - name: Verify standalone Deep V2 pricing, consent and attempt SQL ledger
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_ledger_db.py' -v
      - name: Verify actual quoted Deep V2 C consent and unpaid start
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_quote_db.py' -v
      - name: Mock provider Deep V2 paid pass1 reserve/settlement tests
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_pass1_db.py' -v
      - name: Real PostgreSQL17 immutable Review1 and Pass2 handoff
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_review_db.py' -v
      - name: RTB Deep V2 Pass2 one-paid-call and protected H1 PostgreSQL17 tests
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_pass2_db.py' -v
      - name: Two explicitly consented Deep V2 expansions (PostgreSQL17 mocked)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_expansion_db.py' -v
      - name: Search Readiness and Human Review2 PostgreSQL17 mock E2E
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_review2_db.py' -v
      - name: Atomic Deep V2 publication and real PostgreSQL17 SRE link (mocked provider)
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_v2_publication_db.py' -v
      - name: Read-only RTB V2/V1 publication-ID export and Search Planner PG17 integration
        run: python -m unittest discover -s tests -p 'test_taxonomy_publication_export_v2_db.py' -v
      - name: Verify existing Deep V1 PostgreSQL behavior
        run: python -m unittest discover -s tests -p 'test_taxonomy_deep_db.py' -v
