name: Knowledge B Stage14 fast QA
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-c-knowledge-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
      CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install infrastructure dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Apply PostgreSQL 17 migrations
        run: python -m intelligence.migrate
      - name: Stage14 A to B9 to C contract and integration tests
        run: python -m unittest discover -s tests -p 'test_ke_stage14_c_qualified.py' -v

  windows-c-knowledge-fast:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: 'true'
      CM_DB_ENABLED: '1'
      CM_TEST_PG_DSN: postgresql://postgres:root@127.0.0.1:5432/postgres
      CM_DB_DSN: postgresql://postgres:root@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start hosted PostgreSQL 17
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
      - name: Install infrastructure dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Apply PostgreSQL 17 migrations
        run: python -m intelligence.migrate
      - name: Stage14 A to B9 to C contract and integration tests
        run: python -m unittest discover -s tests -p test_ke_stage14_c_qualified.py -v
