name: QDP isolated integration
on:
  push:
    branches:
      - 'feature/qualified-data-pipeline-v1-20261023'
    paths:
      - 'intelligence/qualified_data/**'
      - 'intelligence/migrations/040_qdp_integration_foundation.sql'
      - 'intelligence/migrations/041_qdp_sre_inbox_quarantine.sql'
      - 'docs/QDP_*.md'
      - 'tests/test_qdp_*.py'
      - 'tests/test_qualified_data_*.py'
      - '.github/workflows/qdp-tests.yml'
  pull_request:
    paths:
      - 'intelligence/qualified_data/**'
      - 'intelligence/migrations/016_qualified_data_pipeline.sql'
      - 'intelligence/migrations/040_qdp_integration_foundation.sql'
      - 'docs/QDP_*.md'
      - 'tests/test_qualified_data_*.py'
      - 'tests/test_qdp_*.py'
      - 'site/qualified-data.js'
      - '.github/workflows/qdp-tests.yml'
  workflow_dispatch:

jobs:
  qdp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentmachine
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: contentmachine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentmachine -d contentmachine"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL driver
        run: python -m pip install -r intelligence/requirements.txt
      - name: Migrate isolated disposable PostgreSQL
        env:
          CM_DB_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m intelligence.migrate
      - name: QDP offline, integration ports and PostgreSQL E2E
        env:
          CM_TEST_PG_DSN: postgresql://contentmachine:ci-only@127.0.0.1:5432/contentmachine
        run: python -m unittest discover -s tests -p 'test_qualified_data_*.py' -v && python -m unittest tests.test_qdp_integration_contracts -v && python -m unittest tests.test_qdp_live_sre_intake -v && python -m unittest tests.test_qdp_coverage -v && python -m unittest tests.test_qdp_schema_migrations -v && python -m unittest tests.test_qdp_qualification -v && python -m unittest tests.test_qdp_sre_inbox -v && python -m unittest tests.test_qdp_run_manifest -v
      - name: Verify Python and JS syntax
        run: python -m compileall -q intelligence/qualified_data && node --check site/qualified-data.js
