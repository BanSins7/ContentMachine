name: React TypeScript frontend
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'site/index.html'
      - 'site/sre-studio.html'
      - 'intelligence/group_a/site/group-a.html'
      - 'app.py'
      - 'auto_update.py'
      - 'scripts/ensure_frontend.py'
      - '.github/workflows/react-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'site/index.html'
      - 'site/sre-studio.html'
      - 'intelligence/group_a/site/group-a.html'
      - 'app.py'
      - 'auto_update.py'
      - 'scripts/ensure_frontend.py'
      - '.github/workflows/react-frontend.yml'
jobs:
  react-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build main, SRE and Group A
        working-directory: frontend
        run: npm run build
      - name: Install Carousel Studio dependencies
        working-directory: carousel-studio
        run: npm install --no-audit --no-fund
      - name: Build native React Carousel Studio
        working-directory: carousel-studio
        run: npm run build
      - name: Install Chromium smoke dependencies
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium
      - name: Chromium production React smoke
        run: node frontend/scripts/smoke-browser.mjs
      - name: Provider settings API unit tests
        run: python -m unittest discover -s tests -p 'test_provider_settings.py' -v
      - name: Python launcher syntax
        run: python -m py_compile app.py auto_update.py scripts/ensure_frontend.py
      - name: Frontend cache and build failure handling
        run: python -m unittest discover -s tests -p 'test_ensure_frontend.py' -v
      - name: Existing workspace contracts
        run: |
          node tests/test_workspace_core.cjs
          node tests/test_workspace_analysis.cjs
