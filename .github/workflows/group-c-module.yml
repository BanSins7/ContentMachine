name: Group C standalone module
on:
  push:
    branches: [feature/group-c-full-module]
  pull_request:
    paths:
      - "intelligence/group_c/**"
      - "intelligence/migrations/056_group_c_runtime.sql"
      - "intelligence/migrations/057_group_c_cohort_freezes.sql"
      - "intelligence/migrations/058_group_c_human_reviews.sql"
      - "intelligence/migrations/059_group_c_config_activation.sql"
      - "intelligence/migrations/060_group_c_calculation_receipts.sql"
      - "tests/test_group_c_*.py"
      - "docs/GROUP_C_*"
      - ".github/workflows/group-c-module.yml"
jobs:
  pure-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standalone Group C contracts and schema-audit tests
        run: python -m unittest discover -s tests -p "test_group_c_*.py" -v
      - name: Existing Performance C schema tests (PG17 tests skip without DSN)
        run: python -m unittest discover -s tests -p "test_performance_c_schema.py" -v
  pg17-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cmgc
          POSTGRES_PASSWORD: cmgc
          POSTGRES_DB: contentmachine_gc_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmgc -d contentmachine_gc_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated Postgres client
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Create a second disposable PG17 upgrade database
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
        run: |
          python -c "import os, psycopg; c=psycopg.connect(os.environ['CM_TEST_PG_DSN'],autocommit=True); c.execute('CREATE DATABASE contentmachine_gc_upgrade'); c.close()"
      - name: Fresh PG17 migration plus Group C lifecycle QA
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
          GC_TEST_MIGRATE_MODE: fresh
        run: python -m unittest discover -s tests -p "test_group_c_runtime_schema.py" -v
      - name: QDP-to-C synthetic producer replay and permissions QA on fresh PG17
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
        run: python -m unittest discover -s tests -p "test_group_c_qdp_intake.py" -v
      - name: D1 source/registry rights and nullability QA on fresh PG17
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
        run: python -m unittest discover -s tests -p "test_group_c_d1.py" -v
      - name: C0 raw snapshot invariants on fresh PostgreSQL 17
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
        run: python -m unittest discover -s tests -p "test_group_c_c0.py" -v
      - name: GC-MOD-08 verified publication time on fresh PG17
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
        run: python -m unittest discover -s tests -p "test_group_c_publication_time.py" -v
      - name: GC-MOD-09 peer strata and raw-latest candidates on fresh PG17
        env:
          CM_TEST_PG_DSN: postgresql://cmgc:cmgc@localhost:5432/contentmachine_gc_fresh
          GC_TEST_DISPOSABLE_DB: "YES"
        run: python -m unittest discover -s tests -p "test_group_c_cohort_rules.py" -v
      - name: GC-MOD-10 serializable cohort freezes on fresh PG17
