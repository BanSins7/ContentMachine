name: Unified Analytics standalone module
on:
  push:
    branches: [feature/unified-analytics-full-module]
  pull_request:
    paths:
      - "intelligence/unified_analytics/**"
      - "intelligence/migrations/080_unified_analytics_core.sql"
      - "tests/test_unified_analytics_*.py"
      - "docs/UNIFIED_ANALYTICS_*"
      - ".github/workflows/unified-analytics-module.yml"
jobs:
  pure-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pure standalone UAE boundary tests
        run: python -m unittest discover -s tests -p "test_unified_analytics_*.py" -v
      - name: Python source syntax
        run: python -m compileall -q intelligence/unified_analytics
  pg17-standalone-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cm_uae_test
          POSTGRES_PASSWORD: cm_uae_test
          POSTGRES_DB: cm_uae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm_uae_test -d cm_uae_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CM_TEST_PG_DSN: postgresql://cm_uae_test:cm_uae_test@127.0.0.1:5432/cm_uae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL client dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Disposable PostgreSQL 17 UAE migration and integrity tests
        run: python -m unittest discover -s tests -p "test_unified_analytics_schema.py" -v
